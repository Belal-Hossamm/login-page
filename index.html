<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <div class="loginform">
            <h1>Login</h1>
            <label>Email:</label><br>
            <input type="email" placeholder="Enter your Email" class="email-input"><br><br>
            <label>Password:</label><br>
            <input type="password" placeholder="Enter your Password" class="pass-input"><br><br>
            <button type="submit" class="btn">Login</button>

        </div>

    </div>

</body>

</html>
